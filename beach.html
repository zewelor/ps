<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Live Beach Cam - bcportosanto</title>
  <meta name="description" content="Watch the live stream of bcportosanto beach.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body, html {
      margin: 0;
      padding: 0;
      overflow: hidden; /* This will hide any scroll bars */
      height: 100%; /* Set the body and html to full height */
    }
    video {
      width: 100vw;
      height: 100vh; /* Set video height to 100% of viewport height */
    }
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: Arial, sans-serif;
    }
  </style>
</head>
<body>
  <div id="loading">Loading video...</div>
  <video
    autoplay
    muted
    controls
    id="video"
    aria-label="Live beach camera stream"
  >
    Your browser does not support the video tag.
  </video>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
  <script>
    (function () {
      var video = document.getElementById('video');
      var loading = document.getElementById('loading');
      var urlParams = new URLSearchParams(window.location.search);
      var camname = urlParams.get('camname') || 'bcportosanto';
      var videoSrc = `https://video-auth1.iol.pt/beachcam/${camname}/playlist.m3u8`;

      function handleVideoError(message) {
        alert(message);
      }

      video.addEventListener('canplay', function () {
        loading.style.display = 'none';
        video.style.display = 'block';
      });

      if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = videoSrc;
        video.addEventListener('error', function () {
          handleVideoError('An error occurred while loading the video.');
        });
      } else if (Hls.isSupported()) {
        var hls = new Hls();
        hls.loadSource(videoSrc);
        hls.attachMedia(video);

        hls.on(Hls.Events.ERROR, function (event, data) {
          if (data.fatal) {
            switch (data.type) {
              case Hls.ErrorTypes.NETWORK_ERROR:
                handleVideoError('Network error: Please check your internet connection.');
                hls.startLoad();
                break;
              case Hls.ErrorTypes.MEDIA_ERROR:
                handleVideoError('Media error: Cannot play this video.');
                hls.recoverMediaError();
                break;
              default:
                hls.destroy();
                handleVideoError('An unrecoverable error occurred.');
                break;
            }
          }
        });
      } else {
        handleVideoError('Your browser does not support HLS playback.');
      }
    })();
  </script>
</body>
</html>
